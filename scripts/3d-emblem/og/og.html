<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@800;900&family=Figtree:wght@500;700&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#062615;font-family:Figtree,sans-serif;color:#f6f8f3;position:relative}
.photo{position:absolute;inset:0;background:url(futsal-ataque.webp) center/cover;opacity:.2;mix-blend-mode:luminosity}
.glow{position:absolute;inset:0;background:radial-gradient(60% 80% at 74% 50%,rgba(16,162,75,.55),transparent 70%),linear-gradient(90deg,rgba(6,38,21,.95) 0%,rgba(6,38,21,.6) 50%,rgba(6,38,21,.2) 100%)}
svg.court{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1120px;color:#f6f8f3;opacity:.16}
.year{position:absolute;right:-30px;top:50%;transform:translateY(-50%);font:900 420px/0.8 'Big Shoulders';color:transparent;-webkit-text-stroke:2px rgba(246,248,243,.14)}
.emb{position:absolute;right:120px;top:50%;transform:translateY(-50%);height:540px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.txt{position:absolute;left:64px;top:70px;width:560px}
.eb{font-weight:700;font-size:17px;letter-spacing:.2em;text-transform:uppercase;color:#64ba4c;display:flex;gap:14px;align-items:center}
.eb:before{content:"";width:34px;height:2px;background:#64ba4c}
h1{font:900 168px/0.82 'Big Shoulders';margin-top:22px;text-transform:uppercase}
h2{font:800 54px/0.95 'Big Shoulders';text-transform:uppercase;margin-top:14px}
h2 span{color:#f5e622}
p{margin-top:26px;font-size:22px;font-weight:500;color:rgba(246,248,243,.82)}
</style></head><body>
<div class="photo"></div><div class="glow"></div>
<svg class="court" viewBox="0 0 41 21" fill="none" stroke="currentColor" stroke-width=".08"><rect x=".5" y=".5" width="40" height="20"/><path d="M20.5 .5v20"/><circle cx="20.5" cy="10.5" r="3"/><path d="M.5 4.5a6 6 0 0 1 6 6a6 6 0 0 1-6 6"/><path d="M40.5 4.5a6 6 0 0 0-6 6a6 6 0 0 0 6 6"/></svg>
<div class="year">1937</div>
<img class="emb" src="emblem-3d.png">
<div class="txt"><div class="eb">Olival Basto · Odivelas</div><h1>GROB</h1><h2>Grupo Recreativo<br>Olival Basto · <span>desde 1937</span></h2><p>Futsal, ténis de mesa, yoga, pilates clínico e zumba.</p></div>
</body></html>
